<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Filmes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <img src="image/cinema.png" alt="cinema">
        <div class="cabecalho">
            <h1>Meu Catálogo de <span>Filmes</span></h1>
            <p>Organize seus Filmes favoritos e acompanhe o que já assistiu.</p>
        </div>
    </header>

    <main>
        <article>
            <div class="cadastro">
                <img src="image/adicionar.png" alt="Sinal de +" style="width: 40px;">
                <h2>Adicionar um novo filme</h2>
                <p>Preencha as informação abaixo para adicionar um filme á sua coleção.</p>

                <form>
                    <label for="inTitulo">Título do filme</label>
                    <input type="text" id="inTitulo" placeholder="Ex.: Inception" required>
                    <label for="inGenero">Gênero</label>
                    <select name="genero" id="inGenero">
                        <option value="sem Genero">Selecione um gênero</option>
                        <option value="Ação">Ação</option>
                        <option value="Ficção cientifica">Ficção cientifica</option>
                        <option value="Drama">Drama</option>
                        <option value="Comedia">Comedia</option>
                        <option value="Terror">Terror</option>
                        <option value="Aventura">Aventura</option>
                    </select>
                    <label for="inImage">Imagem(URL - opcional)</label>
                    <input type="text" id="inImage" placeholder="Ex.: https://exemplo.com/imagem.jpg">
                    <input type="submit" value="+ Adicionar filme">
                </form>

            </div>
        </article>
    </main>
</body>
</html>
